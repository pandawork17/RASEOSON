[project]
name = "react-baseason-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LeeGuWon", email = "your_email@example.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.6.1",
    "passlib>=1.7.4",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
]

[project.scripts]
react-baseason-backend = "react_baseason_backend:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
