[project]
name = "common-backend"
version = "0.1.0"
description = "SHOPDB3JO 통합 공용 백엔드 서버 (구매자 쇼핑몰 + 지사 관리자 + 본사 관리자)"
readme = "INTEGRATION_MANUAL.md"
authors = [
    { name = "SHOPDB 3조", email = "shopdb3jo@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.6.1",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.12",
]

[tool.uv]
package = false

